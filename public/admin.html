<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 - LINEグループ幹事ツール</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: #222; }
  h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-size: .85rem; color: #666; margin-bottom: 4px; }
  input, textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 1rem; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #4a90e2; }
  textarea { resize: vertical; min-height: 120px; }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 8px; border: none; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #4a90e2; color: #fff; }
  .btn-primary:hover { background: #357abd; }
  .btn-sm { padding: 6px 14px; font-size: .85rem; }
  .btn-outline { background: transparent; border: 1px solid #ccc; color: #555; }
  .btn-outline:hover { background: #f0f0f0; }
  .btn-danger { background: transparent; border: 1px solid #fc8181; color: #e53e3e; }
  .btn-danger:hover { background: #fff5f5; }
  .form-row { margin-bottom: 12px; }
  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .event-list { list-style: none; }
  .event-item { padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .event-item:last-child { border-bottom: none; }
  .event-title { font-weight: 600; font-size: .95rem; }
  .event-date { font-size: .8rem; color: #888; margin-top: 2px; }
  .event-link { font-size: .8rem; color: #4a90e2; word-break: break-all; }
  .tab-bar { display: flex; gap: 0; margin-bottom: 16px; background: #e8e8e8; border-radius: 10px; padding: 3px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: .9rem; cursor: pointer; font-weight: 500; color: #666; border: none; background: none; }
  .tab.active { background: #fff; color: #333; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .section { display: none; }
  .section.active { display: block; }
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #login-box { background: #fff; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; }
  #login-box h1 { margin-bottom: 8px; }
  #login-box p { font-size: .85rem; color: #888; margin-bottom: 24px; }
  #login-box input { text-align: center; font-size: 1.5rem; letter-spacing: 8px; margin-bottom: 16px; }
  .msg { font-size: .85rem; color: #e53e3e; margin-top: 8px; }
  .success { color: #38a169; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: .75rem; font-weight: 600; }
  .badge-count { background: #ebf4ff; color: #4a90e2; }
  .copy-btn { background: none; border: none; cursor: pointer; color: #4a90e2; font-size: .8rem; padding: 0; }
  .copy-btn:hover { text-decoration: underline; }
  .result-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .result-table th { text-align: left; padding: 8px 6px; border-bottom: 2px solid #eee; color: #666; font-weight: 600; font-size: .8rem; }
  .result-table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; }
  .result-table tr:last-child td { border-bottom: none; }
  .choice-badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: .8rem; font-weight: 600; }
  .choice-父 { background: #ebf4ff; color: #2b6cb0; }
  .choice-母 { background: #fef3f3; color: #c53030; }
  .choice-子 { background: #f0fff4; color: #276749; }
  .choice-参加しない { background: #f7fafc; color: #718096; }
  .total-row td { font-weight: 700; color: #333; border-top: 2px solid #eee !important; }
  .back-btn { background: none; border: none; color: #4a90e2; font-size: .9rem; cursor: pointer; padding: 0; margin-bottom: 16px; display: flex; align-items: center; gap: 4px; }
  #main-screen { display: none; }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div id="login-box">
    <h1>🎉 幹事ツール</h1>
    <p>管理者パスワードを入力</p>
    <input type="password" id="pw-input" inputmode="numeric" maxlength="10" placeholder="••••" autocomplete="current-password">
    <br>
    <button class="btn btn-primary" style="width:100%" onclick="login()">ログイン</button>
    <div class="msg" id="login-err"></div>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="container">
    <h1>管理画面</h1>

    <div class="tab-bar">
      <button class="tab active" onclick="switchTab(this,'members')">メンバー</button>
      <button class="tab" onclick="switchTab(this,'create')">イベント作成</button>
      <button class="tab" onclick="switchTab(this,'events')">イベント一覧</button>
    </div>

    <!-- メンバー管理 -->
    <div class="section active" id="tab-members">
      <div class="card">
        <h2>メンバーリスト（マスター）</h2>
        <div class="form-row">
          <label>名前を1行に1人ずつ入力</label>
          <textarea id="members-input" placeholder="田中太郎&#10;山田花子&#10;佐藤次郎"></textarea>
        </div>
        <button class="btn btn-primary" onclick="saveMembers()">保存</button>
        <div class="msg" id="members-msg"></div>
      </div>
    </div>

    <!-- イベント作成 -->
    <div class="section" id="tab-create">
      <div class="card">
        <h2>新しいイベントを作成</h2>
        <div class="form-row">
          <label>イベント名 *</label>
          <input type="text" id="ev-title" placeholder="〇〇忘年会">
        </div>
        <div class="form-row">
          <label>日程</label>
          <input type="text" id="ev-date" placeholder="12月20日（金）">
        </div>
        <div class="form-row">
          <label>参加費（円）</label>
          <div class="price-grid">
            <div>
              <label>父</label>
              <input type="number" id="price-父" placeholder="5000" min="0">
            </div>
            <div>
              <label>母</label>
              <input type="number" id="price-母" placeholder="4000" min="0">
            </div>
            <div>
              <label>子</label>
              <input type="number" id="price-子" placeholder="2000" min="0">
            </div>
            <div>
              <label>参加しない</label>
              <input type="number" value="0" disabled style="background:#f5f5f5;color:#999">
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="submitEvent()">作成</button>
        <div class="msg" id="create-msg"></div>
      </div>
    </div>

    <!-- イベント一覧 -->
    <div class="section" id="tab-events">
      <div id="events-view">
        <div class="card" id="events-card">
          <h2>イベント一覧</h2>
          <ul class="event-list" id="events-list">
            <li style="color:#aaa;font-size:.9rem;padding:12px 0">読み込み中...</li>
          </ul>
        </div>
      </div>
      <!-- イベント詳細 -->
      <div id="event-detail" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <button class="back-btn" style="margin-bottom:0" onclick="backToList()">← 一覧に戻る</button>
          <button class="btn btn-danger btn-sm" onclick="deleteEvent(currentEventId, document.getElementById('detail-title').textContent)">削除</button>
        </div>
        <div class="card">
          <h2 id="detail-title"></h2>
          <div style="font-size:.85rem;color:#888;margin-bottom:4px" id="detail-date"></div>
          <div style="font-size:.8rem;margin-bottom:12px">
            <span style="color:#666">URL: </span>
            <span id="detail-url" style="color:#4a90e2;word-break:break-all"></span>
            <button class="copy-btn" onclick="copyUrl()">コピー</button>
          </div>
          <table class="result-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>選択</th>
                <th style="text-align:right">金額</th>
              </tr>
            </thead>
            <tbody id="detail-body"></tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="2">合計</td>
                <td style="text-align:right" id="detail-total"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="card">
          <h2>参加者一覧</h2>
          <table class="result-table">
            <thead>
              <tr><th>名前・区分</th><th>座席</th></tr>
            </thead>
            <tbody id="attendee-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
let adminPw = '';

function eventUrl(id) {
  // ローカル開発時はクエリパラメータ形式、本番はパス形式
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    return `${location.origin}/event.html?id=${id}`;
  }
  return `${location.origin}/event/${id}`;
}

async function api(method, path, body) {
  try {
    const res = await fetch(path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Password': adminPw,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    return res.json();
  } catch (e) {
    return { error: 'サーバーに接続できません: ' + e.message };
  }
}

async function login() {
  const pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  const data = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  }).then(r => r.json());

  if (data.ok) {
    adminPw = pw;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    loadMembers();
    loadEvents();
  } else {
    document.getElementById('login-err').textContent = 'パスワードが違います';
  }
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

function switchTab(btn, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'events') loadEvents();
}

// ---- メンバー ----
async function loadMembers() {
  const data = await api('GET', '/api/admin/members');
  if (data.members) {
    document.getElementById('members-input').value = data.members.join('\n');
  }
}

async function saveMembers() {
  const raw = document.getElementById('members-input').value;
  const members = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const msg = document.getElementById('members-msg');
  const data = await api('PUT', '/api/admin/members', { members });
  if (data.ok) {
    msg.className = 'msg success';
    msg.textContent = `${members.length}人を保存しました`;
    setTimeout(() => msg.textContent = '', 3000);
  } else {
    msg.className = 'msg';
    msg.textContent = data.error || 'エラーが発生しました';
  }
}

// ---- イベント作成 ----
async function submitEvent() {
  const msg = document.getElementById('create-msg');
  try {
    msg.className = 'msg';
    msg.textContent = '送信中...';

    const title = document.getElementById('ev-title').value.trim();
    const date = document.getElementById('ev-date').value.trim();
    const prices = {
      父: parseInt(document.getElementById('price-父').value) || 0,
      母: parseInt(document.getElementById('price-母').value) || 0,
      子: parseInt(document.getElementById('price-子').value) || 0,
      参加しない: 0,
    };
    if (!title) { msg.textContent = 'タイトルを入力してください'; return; }

    const data = await api('POST', '/api/admin/events', { title, date, prices });
    if (data.ok) {
      msg.className = 'msg success';
      const url = eventUrl(data.id);
      msg.textContent = `作成しました！ ${url}`;
      document.getElementById('ev-title').value = '';
      document.getElementById('ev-date').value = '';
    } else {
      msg.textContent = data.error || 'エラーが発生しました';
    }
  } catch (e) {
    msg.textContent = 'エラー: ' + e.message;
  }
}

// ---- イベント一覧 ----
async function loadEvents() {
  const data = await api('GET', '/api/admin/events');
  const list = document.getElementById('events-list');
  if (!data.events || data.events.length === 0) {
    list.innerHTML = '<li style="color:#aaa;font-size:.9rem;padding:12px 0">イベントがありません</li>';
    return;
  }
  list.innerHTML = data.events.map(ev => `
    <li class="event-item">
      <div style="flex:1;min-width:0">
        <div class="event-title">${esc(ev.title)}</div>
        <div class="event-date">${esc(ev.date || '日程未設定')}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="showDetail('${ev.id}')" style="margin-right:6px">詳細</button>
      <button class="btn btn-danger btn-sm" onclick="deleteEvent('${ev.id}', '${escJs(ev.title)}')">削除</button>
    </li>
  `).join('');
}

let currentEventId = '';
async function showDetail(id) {
  currentEventId = id;
  document.getElementById('events-view').style.display = 'none';
  document.getElementById('event-detail').style.display = 'block';

  const data = await api('GET', `/api/admin/events/${id}`);
  const { event, responses } = data;
  document.getElementById('detail-title').textContent = event.title;
  document.getElementById('detail-date').textContent = event.date || '';
  const url = eventUrl(id);
  document.getElementById('detail-url').textContent = url;

  let total = 0;
  const rows = event.members.map(name => {
    const r = responses[name];
    // 旧形式（choice）・新形式（choices）両対応
    const choices = r ? (r.choices ?? (r.choice ? [r.choice] : [])) : [];
    const price = choices.reduce((sum, c) => sum + (event.prices[c] || 0), 0);
    total += price;
    const BADGE_ORDER = ['父', '母', '子'];
    const sorted = [...choices].sort((a, b) => BADGE_ORDER.indexOf(a) - BADGE_ORDER.indexOf(b));
    const badgesHtml = sorted.length
      ? sorted.map(c => `<span class="choice-badge choice-${esc(c)}">${esc(c)}</span>`).join(' ')
      : '<span style="color:#bbb">未回答</span>';
    return `<tr>
      <td>${esc(name)}</td>
      <td>${badgesHtml}</td>
      <td style="text-align:right">${price > 0 ? '¥' + price.toLocaleString() : '-'}</td>
    </tr>`;
  }).join('');

  document.getElementById('detail-body').innerHTML = rows;
  document.getElementById('detail-total').textContent = '¥' + total.toLocaleString();

  // 参加者一覧：子→父→母の順でグループ化
  const ATTENDEE_ORDER = ['子', '父', '母'];
  const attendeeRows = ATTENDEE_ORDER.flatMap(choice => {
    return event.members
      .filter(name => {
        const r = responses[name];
        const choices = r ? (r.choices ?? (r.choice ? [r.choice] : [])) : [];
        return choices.includes(choice);
      })
      .map(name => `<tr><td>${esc(name)}・${esc(choice)}</td><td></td></tr>`);
  });
  document.getElementById('attendee-body').innerHTML =
    attendeeRows.length ? attendeeRows.join('') : '<tr><td style="color:#aaa">参加者なし</td></tr>';
}

async function deleteEvent(id, title) {
  if (!confirm(`「${title}」を削除しますか？\n回答データも含めて完全に削除されます。`)) return;
  const data = await api('DELETE', `/api/admin/events/${id}`);
  if (data.ok) {
    backToList();
  } else {
    alert(data.error || '削除に失敗しました');
  }
}

function backToList() {
  document.getElementById('events-view').style.display = 'block';
  document.getElementById('event-detail').style.display = 'none';
  loadEvents();
}

function copyUrl() {
  const url = eventUrl(currentEventId);
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'コピーしました！';
    setTimeout(() => btn.textContent = 'コピー', 2000);
  });
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escJs(str) {
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
</script>
</body>
</html>
