<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参加確認</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
  .header { background: #fff; padding: 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 1.1rem; font-weight: 700; }
  .header .date { font-size: .8rem; color: #888; margin-top: 2px; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 100px; }
  .instruction { background: #ebf4ff; border-radius: 10px; padding: 12px 14px; font-size: .85rem; color: #2b6cb0; margin-bottom: 16px; }

  /* メンバーリスト */
  .member-list { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .member-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; gap: 12px; transition: background .15s; }
  .member-row:last-child { border-bottom: none; }
  .member-row.editing { background: #f0f7ff; }
  .member-info { flex: 1; cursor: pointer; user-select: none; min-width: 0; }
  .member-name { font-size: .95rem; font-weight: 500; }
  .member-name:hover { color: #4a90e2; }
  .member-subtotal { font-size: .8rem; font-weight: 700; color: #4a90e2; margin-top: 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; align-items: center; }
  .choice-badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .choice-未回答 { background: #f7f7f7; color: #bbb; }
  .edit-icon { color: #ccc; font-size: 1rem; cursor: pointer; padding: 4px; flex-shrink: 0; }
  .edit-icon:hover { color: #4a90e2; }

  /* 選択パネル（行内展開） */
  .choice-panel { display: none; padding: 10px 16px 14px; background: #f0f7ff; border-bottom: 1px solid #d0e6ff; }
  .choice-panel.open { display: block; }
  .panel-hint { font-size: .8rem; color: #4a90e2; margin-bottom: 8px; }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice-btn { padding: 12px 8px; border: 2px solid #ddd; border-radius: 10px; background: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; text-align: center; color: #555; transition: all .15s; position: relative; }
  .choice-btn:hover { border-color: #4a90e2; color: #4a90e2; background: #f0f7ff; }
  .check-mark { position: absolute; top: 4px; right: 6px; font-size: .7rem; }
  .cancel-row { text-align: center; margin-top: 10px; }
  .cancel-btn { background: none; border: none; color: #aaa; font-size: .85rem; cursor: pointer; }
  .cancel-btn:hover { color: #555; }
  .price-hint { font-size: .75rem; color: #999; margin-top: 3px; text-align: center; }

  /* 合計フッター */
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; padding: 14px 20px; box-shadow: 0 -2px 12px rgba(0,0,0,.06); }
  .footer-inner { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .footer-label { font-size: .85rem; color: #888; }
  .footer-total { font-size: 1.4rem; font-weight: 700; color: #333; }
  .footer-detail { font-size: .75rem; color: #aaa; margin-top: 2px; }

  .loading { text-align: center; padding: 48px; color: #aaa; }
  .error-msg { text-align: center; padding: 48px; color: #e53e3e; }
  .saving-toast { position: fixed; top: 16px; right: 16px; background: #333; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: .85rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; }
  .saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1 id="event-title">読み込み中...</h1>
  <div class="date" id="event-date"></div>
</div>

<div class="container">
  <div class="instruction">自分の名前をタップしてください</div>
  <div id="member-list-wrap">
    <div class="loading">読み込み中...</div>
  </div>
</div>

<div class="footer">
  <div class="footer-inner">
    <div>
      <div class="footer-label">参加費合計</div>
      <div class="footer-detail" id="footer-detail"></div>
    </div>
    <div class="footer-total" id="footer-total">¥0</div>
  </div>
</div>

<div class="saving-toast" id="toast">保存しました</div>

<script>
const CHOICE_THEMES = [
  { bg: '#ebf4ff', fg: '#2b6cb0' },
  { bg: '#fef3f3', fg: '#c53030' },
  { bg: '#f0fff4', fg: '#276749' },
  { bg: '#faf5ff', fg: '#6b46c1' },
  { bg: '#fff8e1', fg: '#b7791f' },
  { bg: '#e6fffa', fg: '#285e61' },
];
const EXCL_THEME = { bg: '#f7fafc', fg: '#718096' };

// /survey?id=abc123
const eventId = new URLSearchParams(location.search).get('id') || '';
let eventData = null;
let responses = {};   // { name: { choices: [...] } }
let openMember = null;
let choiceMap = {};   // { label: { price, exclusive, theme } }
let choiceOrder = []; // ordered labels

function buildChoiceMap(choices) {
  let idx = 0;
  choiceMap = {};
  choiceOrder = choices.map(c => c.label);
  for (const c of choices) {
    const theme = c.exclusive ? EXCL_THEME : CHOICE_THEMES[idx++ % CHOICE_THEMES.length];
    choiceMap[c.label] = { price: c.price, exclusive: c.exclusive, theme };
  }
}

function sortChoices(arr) {
  return [...arr].sort((a, b) => choiceOrder.indexOf(a) - choiceOrder.indexOf(b));
}

// 名前をHTML id属性に安全に使うため空白等をエスケープ
function nameToId(name) {
  return name.replace(/\s/g, '_').replace(/[^a-zA-Z0-9_　-鿿゠-ヿ぀-ゟ]/g, '_');
}

async function load() {
  const res = await fetch(`/api/events/${eventId}`);
  if (!res.ok) {
    document.getElementById('member-list-wrap').innerHTML = '<div class="error-msg">イベントが見つかりません</div>';
    return;
  }
  const data = await res.json();
  eventData = data;
  buildChoiceMap(data.choices);
  // 旧形式（choice: 文字列）を新形式（choices: 配列）に正規化
  responses = {};
  for (const [name, r] of Object.entries(data.responses || {})) {
    responses[name] = { choices: r.choices ?? (r.choice ? [r.choice] : []) };
  }
  document.getElementById('event-title').textContent = data.title;
  document.getElementById('event-date').textContent = data.date || '';
  document.title = data.title + ' - 参加確認';
  render();
}

function render() {
  const wrap = document.getElementById('member-list-wrap');
  const members = eventData.members;

  const html = `<div class="member-list">${members.map(name => {
    const r = responses[name];
    const selected = r ? r.choices : [];
    const subtotal = selected.reduce((s, c) => s + (choiceMap[c]?.price || 0), 0);
    const sorted = sortChoices(selected);
    const badgesHtml = sorted.length
      ? sorted.map(c => {
          const info = choiceMap[c];
          const t = info ? info.theme : EXCL_THEME;
          return `<span class="choice-badge" style="background:${t.bg};color:${t.fg}">${esc(c)}</span>`;
        }).join('')
      : `<span class="choice-badge choice-未回答">未回答</span>`;
    const subtotalText = selected.length
      ? (subtotal > 0 ? '¥' + subtotal.toLocaleString() : '無料')
      : '';

    return `
      <div>
        <div class="member-row" id="row-${nameToId(name)}" data-name="${esc(name)}">
          <div class="member-info" onclick="toggleEdit('${escJs(name)}')">
            <div class="member-name">${esc(name)}</div>
            <div class="member-subtotal" id="subtotal-${nameToId(name)}">${subtotalText}</div>
          </div>
          <div class="badges" id="badge-${nameToId(name)}">${badgesHtml}</div>
          <span class="edit-icon" onclick="toggleEdit('${escJs(name)}')">✏️</span>
        </div>
        <div class="choice-panel" id="panel-${nameToId(name)}">
          <div class="panel-hint">参加する人をタップしてください。選択が終わりましたら閉じるをタップしてください。</div>
          <div class="choice-grid">
            ${eventData.choices.map(c => {
              const isOn = selected.includes(c.label);
              const t = choiceMap[c.label].theme;
              const btnStyle = isOn ? `border-color:${t.fg};color:${t.fg};background:${t.bg}` : '';
              return `<div>
                <button class="choice-btn"
                  style="${btnStyle}"
                  id="btn-${nameToId(name)}-${nameToId(c.label)}"
                  onclick="toggleChoice('${escJs(name)}', '${escJs(c.label)}')">
                  ${esc(c.label)}${isOn ? '<span class="check-mark">✓</span>' : ''}
                </button>
                <div class="price-hint">${c.price > 0 ? '¥' + c.price.toLocaleString() : '無料'}</div>
              </div>`;
            }).join('')}
          </div>
          <div class="cancel-row">
            <button class="cancel-btn" onclick="cancelEdit('${escJs(name)}')">閉じる</button>
          </div>
        </div>
      </div>
    `;
  }).join('')}</div>`;

  wrap.innerHTML = html;
  updateTotal();
}

function toggleEdit(name) {
  if (openMember === name) { cancelEdit(name); return; }
  if (openMember) cancelEdit(openMember);
  openMember = name;
  document.getElementById(`panel-${nameToId(name)}`).classList.add('open');
  document.getElementById(`row-${nameToId(name)}`).classList.add('editing');
}

function cancelEdit(name) {
  openMember = null;
  const panel = document.getElementById(`panel-${nameToId(name)}`);
  const row = document.getElementById(`row-${nameToId(name)}`);
  if (panel) panel.classList.remove('open');
  if (row) row.classList.remove('editing');
}

async function toggleChoice(name, choiceLabel) {
  const r = responses[name] || { choices: [] };
  let selected = [...r.choices];
  const info = choiceMap[choiceLabel];

  if (info && info.exclusive) {
    // 排他的選択肢: 選択するとすべてクリアして自分だけセット（再クリックで解除）
    selected = selected.includes(choiceLabel) ? [] : [choiceLabel];
  } else {
    // 非排他的選択肢: 排他的選択肢をすべてクリアしてトグル
    selected = selected.filter(c => !choiceMap[c]?.exclusive);
    if (selected.includes(choiceLabel)) {
      selected = selected.filter(c => c !== choiceLabel);
    } else {
      selected = [...selected, choiceLabel];
    }
  }

  responses[name] = { choices: selected };
  updateBadge(name, selected);
  updatePanel(name, selected);
  updateTotal();

  showToast('保存中...');
  try {
    const res = await fetch(`/api/events/${eventId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberName: name, choices: selected }),
    });
    showToast(res.ok ? '保存しました ✓' : '保存に失敗しました');
  } catch (e) {
    showToast('保存に失敗しました');
  }
}

function updateBadge(name, selected) {
  const badgeEl = document.getElementById(`badge-${nameToId(name)}`);
  if (badgeEl) {
    const sorted = sortChoices(selected);
    badgeEl.innerHTML = sorted.length
      ? sorted.map(c => {
          const info = choiceMap[c];
          const t = info ? info.theme : EXCL_THEME;
          return `<span class="choice-badge" style="background:${t.bg};color:${t.fg}">${esc(c)}</span>`;
        }).join('')
      : `<span class="choice-badge choice-未回答">未回答</span>`;
  }
  const subtotalEl = document.getElementById(`subtotal-${nameToId(name)}`);
  if (subtotalEl) {
    const subtotal = selected.reduce((s, c) => s + (choiceMap[c]?.price || 0), 0);
    subtotalEl.textContent = selected.length
      ? (subtotal > 0 ? '¥' + subtotal.toLocaleString() : '無料')
      : '';
  }
}

function updatePanel(name, selected) {
  eventData.choices.forEach(c => {
    const btn = document.getElementById(`btn-${nameToId(name)}-${nameToId(c.label)}`);
    if (!btn) return;
    const isOn = selected.includes(c.label);
    const t = choiceMap[c.label].theme;
    btn.style = isOn ? `border-color:${t.fg};color:${t.fg};background:${t.bg}` : '';
    btn.innerHTML = esc(c.label) + (isOn ? '<span class="check-mark">✓</span>' : '');
  });
}

function updateTotal() {
  if (!eventData) return;
  let total = 0;
  const counts = {};
  for (const r of Object.values(responses)) {
    for (const label of r.choices) {
      const info = choiceMap[label];
      if (!info) continue;
      total += info.price;
      if (info.price > 0) counts[label] = (counts[label] || 0) + 1;
    }
  }
  document.getElementById('footer-total').textContent = '¥' + total.toLocaleString();
  const detailText = Object.entries(counts).map(([c, n]) => `${c}×${n}`).join(' ');
  document.getElementById('footer-detail').textContent = detailText;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escJs(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

load();
</script>
</body>
</html>
